<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="logo-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="logo-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0a0020"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines subtle -->
  <g stroke="#4f46e5" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="626" rx="16" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <!-- Logo mark (scaled up, centered-left area) -->
  <g transform="translate(120, 215) scale(3.5)" filter="url(#shadow)">
    <rect x="16" y="30" width="36" height="20" rx="3" fill="url(#logo-back)" opacity="0.6" transform="skewX(-10)"/>
    <rect x="12" y="20" width="36" height="20" rx="3" fill="url(#logo-mid)" opacity="0.85" transform="skewX(-10)"/>
    <rect x="8" y="10" width="36" height="20" rx="3" fill="url(#logo-front)" transform="skewX(-10)"/>
    <rect x="46" y="14" width="10" height="4" rx="2" fill="#818cf8" opacity="0.9"/>
    <rect x="46" y="22" width="7" height="3" rx="1.5" fill="#6366f1" opacity="0.7"/>
  </g>

  <!-- Main Title -->
  <text x="120" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#title-grad)">BoomTech Gateway</text>

  <!-- Subtitle -->
  <text x="122" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="#94a3b8" letter-spacing="2">Universal Crypto Protocol</text>

  <!-- Feature pills -->
  <g transform="translate(120, 400)">
    <!-- Wallet -->
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="70" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">Wallet</text>

    <!-- Market -->
    <rect x="156" y="0" width="140" height="44" rx="22" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="226" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">Market</text>

    <!-- Shop -->
    <rect x="312" y="0" width="140" height="44" rx="22" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="382" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">Shop</text>

    <!-- AI -->
    <rect x="468" y="0" width="140" height="44" rx="22" fill="#4c1d95" fill-opacity="0.6" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="1"/>
    <text x="538" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#c4b5fd" text-anchor="middle">AI Chat</text>

    <!-- Community -->
    <rect x="624" y="0" width="170" height="44" rx="22" fill="#312e81" fill-opacity="0.6" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1"/>
    <text x="709" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">Community</text>
  </g>

  <!-- Chains label -->
  <text x="120" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#64748b">รองรับ ETH · BNB · Polygon · Arbitrum · Optimism · Avalanche · Base</text>

  <!-- URL badge -->
  <rect x="120" y="548" width="220" height="40" rx="20" fill="#1e1b4b" fill-opacity="0.8" stroke="#4f46e5" stroke-opacity="0.4" stroke-width="1"/>
  <text x="230" y="574" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#a5b4fc" text-anchor="middle">boomtech.app</text>

  <!-- BETA badge -->
  <rect x="1020" y="40" width="120" height="36" rx="8" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1"/>
  <text x="1080" y="63" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="3">BETA</text>
</svg>
